<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#oceanGrad)" stroke="#38BDF8" stroke-width="2" />
  
  <!-- Compass / Radar concentric rings -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="#38BDF8" stroke-dasharray="3,3" stroke-width="1" opacity="0.4" />
  <circle cx="50" cy="50" r="24" fill="none" stroke="#38BDF8" stroke-dasharray="2,2" stroke-width="0.8" opacity="0.3" />

  <!-- Offshore Rig Derrick Silhouette -->
  <!-- Legs -->
  <line x1="32" y1="76" x2="45" y2="28" stroke="#F8FAFC" stroke-width="2.5" stroke-linecap="round" />
  <line x1="68" y1="76" x2="55" y2="28" stroke="#F8FAFC" stroke-width="2.5" stroke-linecap="round" />
  <line x1="45" y1="28" x2="55" y2="28" stroke="#F8FAFC" stroke-width="2" />
  
  <!-- Derrick Cross Braces -->
  <line x1="36" y1="62" x2="64" y2="62" stroke="#94A3B8" stroke-width="1.5" />
  <line x1="40" y1="46" x2="60" y2="46" stroke="#94A3B8" stroke-width="1.5" />
  <line x1="36" y1="62" x2="60" y2="46" stroke="#94A3B8" stroke-width="1.2" />
  <line x1="64" y1="62" x2="40" y2="46" stroke="#94A3B8" stroke-width="1.2" />
  <line x1="40" y1="46" x2="55" y2="28" stroke="#94A3B8" stroke-width="1.2" />
  <line x1="60" y1="46" x2="45" y2="28" stroke="#94A3B8" stroke-width="1.2" />

  <!-- Crown Block & Flare -->
  <rect x="47" y="24" width="6" height="4" fill="#F8FAFC" rx="1" />
  <circle cx="50" cy="20" r="3.5" fill="url(#amberGlow)" />

  <!-- Rig Deck / Platform -->
  <rect x="26" y="74" width="48" height="6" fill="#F59E0B" rx="2" />
  <line x1="30" y1="80" x2="30" y2="86" stroke="#F8FAFC" stroke-width="2" />
  <line x1="70" y1="80" x2="70" y2="86" stroke="#F8FAFC" stroke-width="2" />

  <!-- Navigation GPS Ping / Target -->
  <polygon points="50,8 54,16 50,14 46,16" fill="#38BDF8" />
</svg>
