[project]
name = "oil-and-gas-rig-navigator-agent"
version = "0.1.0"
description = "Oil & Gas Rig Navigator Agent - Real-Time Offshore & Onshore Rig Tracking, Telemetry & Interactive A2UI Surfaces for Gemini Enterprise"
authors = [
    {name = "Upstream Engineering Team", email = "upstream@company.com"},
]

dependencies = [
    "google-adk[gcp,otel-gcp]>=2.6.0,<3.0.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "gcsfs>=2024.11.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-cloud-storage>=2.18.0,<4.0.0",
    "google-cloud-bigquery>=3.25.0,<4.0.0",
    "google-cloud-aiplatform[evaluation,agent-engines]>=1.156.0",
    "protobuf>=6.31.1,<7.0.0",
    "numpy>=1.26,<3.0",
    "scipy>=1.17.1",
    "pillow>=12.3.0",
]
requires-python = ">=3.11,<3.14"

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
    "jsonschema>=4.20.0,<5.0.0",
    "matplotlib>=3.11.2",
    "vl-convert-python>=1.9.0.post1",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.6.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["app"]
